name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0 or v0.2.0). Defaults to git ref name.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI (all platforms)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod

      - name: Build web frontend
        run: |
          cd web
          npm ci
          npx tsc -b --force
          npx vite build
          cd ..
          printf 'Frontend assets are generated by scripts/build.sh.\n' > server/internal/webui/dist/.placeholder

      - name: Validate shared license assets
        run: |
          [ -f LICENSE ] || { echo "error: missing LICENSE" >&2; exit 1; }
          [ -f THIRD_PARTY_NOTICES.md ] || { echo "error: missing THIRD_PARTY_NOTICES.md" >&2; exit 1; }
          [ -d third_party/licenses ] || { echo "error: missing third_party/licenses/" >&2; exit 1; }

      - name: Cross-compile CLI binaries
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          ROOT_DIR="$PWD"
          LDFLAGS="-s -w -X main.version=${VERSION} -X flowdrop/internal/api.Version=${VERSION}"

          for target in \
            "linux amd64" \
            "linux arm64" \
            "darwin amd64" \
            "darwin arm64" \
            "windows amd64" \
            "windows arm64"
          do
            read -r GOOS GOARCH <<< "$target"
            STAGE="$(mktemp -d)"
            BIN_NAME="flowdrop"
            if [ "$GOOS" = "windows" ]; then
              BIN_NAME="flowdrop.exe"
            fi

            echo "==> Building ${GOOS}/${GOARCH}"
            (cd "$ROOT_DIR/server" && \
              GOOS="$GOOS" GOARCH="$GOARCH" go build \
                -trimpath \
                -ldflags "$LDFLAGS" \
                -o "$STAGE/$BIN_NAME" ./cmd/flowdrop)

            # Every CLI archive carries the project license and the
            # third-party notices at the archive root.
            install -m 0644 "$ROOT_DIR/LICENSE" "$STAGE/LICENSE"
            install -m 0644 "$ROOT_DIR/THIRD_PARTY_NOTICES.md" "$STAGE/THIRD_PARTY_NOTICES.md"
            mkdir -p "$STAGE/third_party"
            cp -R "$ROOT_DIR/third_party/licenses" "$STAGE/third_party/licenses"

            # The Linux archive also ships the optional systemd user unit and
            # the LAN plain-HTTP env template. They are NOT installed by the
            # archive: enabling the service stays a manual, documented step.
            if [ "$GOOS" = "linux" ]; then
              mkdir -p "$STAGE/deploy"
              install -m 0644 "$ROOT_DIR/deploy/flowdrop.service" "$STAGE/deploy/flowdrop.service"
              install -m 0644 "$ROOT_DIR/deploy/http-lan.env.example" "$STAGE/deploy/http-lan.env.example"
            fi

            if [ "$GOOS" = "windows" ]; then
              (cd "$STAGE" && zip -q -X -r "$ROOT_DIR/dist/flowdrop-cli-${GOOS}-${GOARCH}.zip" .)
            else
              (cd "$STAGE" && tar -czf "$ROOT_DIR/dist/flowdrop-cli-${GOOS}-${GOARCH}.tar.gz" .)
            fi
            rm -rf "$STAGE"
          done

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-artifacts
          path: dist/flowdrop-cli-*
          if-no-files-found: error

  build-desktop-linux:
    name: Build Desktop (Linux amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Install GTK3 and WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod

      - name: Validate shared license assets
        run: |
          [ -f LICENSE ] || { echo "error: missing LICENSE" >&2; exit 1; }
          [ -f THIRD_PARTY_NOTICES.md ] || { echo "error: missing THIRD_PARTY_NOTICES.md" >&2; exit 1; }
          [ -d third_party/licenses ] || { echo "error: missing third_party/licenses/" >&2; exit 1; }

      - name: Build Linux desktop binary and tarball
        env:
          FLOWDROP_VERSION: ${{ steps.meta.outputs.version }}-desktop
        run: |
          bash scripts/build-desktop.sh

          # The tarball is self-contained: binary, the user-level installer,
          # the .desktop template and the icons, plus project licenses. Users
          # extract it and run ./install-desktop.sh; no checkout or build.
          PKG_NAME="flowdrop-desktop-linux-amd64"
          STAGE="$(mktemp -d)"
          PKG="$STAGE/$PKG_NAME"
          mkdir -p "$PKG/deploy"
          install -m 0755 dist/flowdrop-desktop "$PKG/flowdrop-desktop"
          install -m 0755 scripts/install-desktop.sh "$PKG/install-desktop.sh"
          cp -R deploy/desktop "$PKG/deploy/desktop"
          install -m 0644 LICENSE "$PKG/LICENSE"
          install -m 0644 THIRD_PARTY_NOTICES.md "$PKG/THIRD_PARTY_NOTICES.md"
          mkdir -p "$PKG/third_party"
          cp -R third_party/licenses "$PKG/third_party/licenses"
          tar -C "$STAGE" -czf dist/${PKG_NAME}.tar.gz "$PKG_NAME"
          rm -rf "$STAGE"

      - name: Upload Linux desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-artifacts
          path: dist/flowdrop-desktop-linux-amd64.tar.gz
          if-no-files-found: error

  build-desktop-windows:
    name: Build Desktop (Windows amd64 & arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # Windows VS_VERSION_INFO needs a numeric version. Tag builds and an
          # explicit workflow_dispatch version qualify; a manual run on main
          # (or any branch) keeps the default release version instead of
          # stamping "main" into the exe.
          VERSION="${RAW_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::warning::'$RAW_VERSION' is not a numeric version; Windows exe/README fall back to 0.0.3"
            VERSION="0.0.3"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod

      - name: Build web frontend
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          printf 'Frontend assets are generated by scripts/build.sh.\n' > server/internal/webui/dist/.placeholder

      - name: Package Windows desktop zips
        env:
          # The exe VS_VERSION_INFO and the bundled README.txt follow the tag
          # (0.0.3 -> 0.0.3.0). package-windows.sh also adds LICENSE,
          # THIRD_PARTY_NOTICES.md and third_party/licenses/ to each zip.
          FLOWDROP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bash scripts/package-windows.sh
          bash scripts/package-windows.sh --arm64

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-artifacts
          path: |
            dist/flowdrop-windows-amd64.zip
            dist/flowdrop-windows-arm64.zip
          if-no-files-found: error

  build-android:
    name: Build Android (Release APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$ANDROID_KEY_ALIAS" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "$ANDROID_KEY_PASSWORD" ] && missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Error: Missing required Android signing secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Resolve version
        id: meta
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.keystore"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLOWDROP_VERSION_NAME: ${{ steps.meta.outputs.version }}
          FLOWDROP_VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Stage Android APK
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/flowdrop-android-${VERSION}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/flowdrop-android-*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-cli
      - build-desktop-linux
      - build-desktop-windows
      - build-android
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG=""
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            TAG="v${INPUT_VERSION#v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*

      - name: Upload checksums artifact (dispatch without tag)
        if: steps.meta.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: release-assets/SHA256SUMS.txt
