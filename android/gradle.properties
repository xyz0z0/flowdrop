# JDK 17+ is required by AGP 8.x. This machine keeps its JDK 21 under
# ~/.gradle/jdks; override with -Dorg.gradle.java.home=... or JAVA_HOME if your
# JDK lives elsewhere.
org.gradle.java.home=/home/bob/.gradle/jdks/eclipse_adoptium-21-amd64-linux.2
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
