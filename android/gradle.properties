# JDK 17+ is required by AGP 8.x. Point JAVA_HOME at your JDK, or pass
# -Dorg.gradle.java.home=/path/to/jdk for one build; do not hardcode a
# machine-specific path here, this file is committed.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
